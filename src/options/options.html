<!doctype html>
<html><head><meta charset="utf-8"><title>LM Companion</title>
<link rel="stylesheet" href="../lib/view.css">
<style>
 body{max-width:600px;margin:0 auto;padding:36px 20px 60px;font:14px/1.55 var(--font);color:var(--fg);-webkit-font-smoothing:antialiased;
   background:radial-gradient(80% 40% at 0% 0%,var(--bg-a),transparent 60%),radial-gradient(80% 50% at 100% 10%,var(--bg-b),transparent 60%),
   radial-gradient(80% 40% at 50% 100%,var(--bg-c),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;box-sizing:border-box}
 h1{font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;margin:0 0 4px}
 h1::before{content:'';width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent-2),var(--accent));box-shadow:0 3px 8px rgba(110,92,230,.35)}
 .intro{color:var(--muted);font-size:13px;margin:0 0 18px}
 h2{font-size:12px;font-weight:600;color:var(--muted);margin:24px 0 6px 14px}
 .group{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:14px;padding:2px 14px;
   backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
 .group > label{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:10px 0;border-bottom:1px solid var(--hair)}
 .group > label:last-child{border-bottom:0}
 small{color:var(--muted);display:block;font-size:12px}
 select{font:inherit;color:var(--fg);background:var(--glass-strong);border:1px solid var(--hair);border-radius:8px;padding:3px 8px}
 button.pill{font:inherit;font-size:13px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border:0;border-radius:8px;padding:4px 12px;cursor:pointer;white-space:nowrap}
 #saved{font-size:12px;font-weight:600;color:var(--accent);margin-left:auto;opacity:0;transition:opacity .3s}
 .tabs{display:inline-flex;gap:2px;margin:0 0 8px 0;padding:2px;border-radius:9px;background:var(--hair)}
 .tabs button{font:inherit;font-size:13px;border:0;background:none;color:var(--muted);border-radius:7px;padding:3px 14px;cursor:pointer}
 .tabs button.on{background:var(--glass-strong);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
 .sechint{margin:0 0 8px 14px}
 .row{display:flex;align-items:center;gap:10px}
 input[type=time]{font:inherit;color:var(--fg);background:var(--glass-strong);border:1px solid var(--hair);border-radius:8px;padding:2px 6px}
 .chips{flex-wrap:wrap;justify-content:flex-end;gap:6px}
 label.opt{display:inline-flex;align-items:center;gap:0;cursor:pointer}
 label.opt input{display:none}
 label.opt span{font-size:12px;padding:3px 10px;border-radius:12px;background:var(--hair);color:var(--muted)}
 label.opt input:checked + span{background:var(--accent);color:#fff}
 .group.off label.dep{opacity:.45;pointer-events:none}
 .always{color:var(--accent);font-weight:700;padding-right:8px}
 #layout{background:var(--glass);border:1px solid var(--glass-edge);box-shadow:var(--shadow);border-radius:14px;padding:2px 4px;backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
 #layout li{background:none;border:0;box-shadow:none;border-radius:0;margin:0;border-bottom:1px solid var(--hair);backdrop-filter:none;-webkit-backdrop-filter:none;padding:9px 10px}
 #layout li:last-child{border-bottom:0}
 .intro{text-wrap:pretty}
 button.pill:disabled{opacity:.4;cursor:default}
 button.link{font:inherit;font-size:13px;border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 0 0 14px}
</style></head>
<body>
<h1><span data-i18n="app">LM Companion</span><span id="saved" data-i18n="o_saved">Saved</span></h1>
<p class="intro" data-i18n="o_intro"></p>

<h2 data-i18n="o_lang"></h2>
<div class="group">
  <label><span data-i18n="o_lang_row"></span><select id="lang"><option value="auto" data-i18n="o_lang_auto"></option><option value="zh">简体中文</option><option value="en">English</option></select></label>
</div>

<h2 data-i18n="o_where"></h2>
<div class="group">
  <label><span><span data-i18n="o_popup"></span><small data-i18n="o_popup_hint"></small></span><span class="always">✓</span></label>
  <label><span><span data-i18n="o_panel"></span><small data-i18n="o_panel_hint"></small></span><input type="checkbox" class="switch" id="showPanel"></label>
</div>

<h2 data-i18n="o_sections"></h2>
<p class="sechint"><small data-i18n="o_sections_hint"></small></p>
<div class="tabs"><button type="button" data-surface="popup" class="on" data-i18n="o_tab_popup"></button><button type="button" data-surface="panel" data-i18n="o_tab_panel"></button></div>
<ol id="layout" class="layout"></ol>
<button type="button" id="resetLayout" class="link" data-i18n="o_reset_layout"></button>

<h2 data-i18n="o_bar"></h2>
<div class="group">
  <label><span><span data-i18n="o_bar_on"></span><small id="barHint" data-i18n="o_bar_hint"></small></span><input type="checkbox" class="switch" id="barOn"></label>
</div>

<h2 data-i18n="o_remind"></h2>
<div class="group">
  <label><span><span data-i18n="o_remind_on"></span><small data-i18n="o_remind_on_hint"></small></span><input type="checkbox" class="switch" id="remindOn"></label>
  <label class="dep"><span><span data-i18n="o_morning"></span><small data-i18n="o_morning_hint"></small></span><span class="row"><input type="time" id="morningAt"><input type="checkbox" class="switch" id="morningOn"></span></label>
  <label class="dep"><span data-i18n="o_before"></span><span class="row chips">
    <label class="opt"><input type="checkbox" data-before="24"><span data-i18n="o_b_24"></span></label>
    <label class="opt"><input type="checkbox" data-before="3"><span data-i18n="o_b_3"></span></label>
    <label class="opt"><input type="checkbox" data-before="2"><span data-i18n="o_b_2"></span></label>
    <label class="opt"><input type="checkbox" data-before="1"><span data-i18n="o_b_1"></span></label></span></label>
  <label class="dep"><span></span><button type="button" class="pill" id="testNotify" data-i18n="o_test"></button></label>
</div>

<h2 data-i18n="o_due"></h2>
<div class="group">
  <label><span data-i18n="o_window"></span><select id="windowDays"><option value="7" data-i18n="o_days" data-i18n-n="7"></option><option value="14" data-i18n="o_days" data-i18n-n="14"></option><option value="30" data-i18n="o_days" data-i18n-n="30"></option></select></label>
  <label><span data-i18n="o_refresh"></span><select id="refreshMinutes"><option value="30" data-i18n="o_30m"></option><option value="60" data-i18n="o_1h"></option><option value="180" data-i18n="o_3h"></option></select></label>
  <label><span><span data-i18n="o_only"></span><small data-i18n="o_only_hint"></small></span><input type="checkbox" class="switch" id="onlyModules"></label>
  <label><span><span data-i18n="o_hidden"></span><small id="hiddenCount"></small></span><button id="resetItems" type="button" class="pill" data-i18n="o_show_again"></button></label>
</div>

<h2 data-i18n="o_log"></h2>
<div class="group">
  <label><span><span data-i18n="o_log_label"></span><small data-i18n="o_log_hint"></small></span><input type="checkbox" class="switch" id="studyLog"></label>
</div>

<h2 data-i18n="o_changes"></h2>
<div class="group">
  <label><span data-i18n="o_c_materials"></span><input type="checkbox" class="switch" data-change="materials"></label>
  <label><span data-i18n="o_c_grades"></span><input type="checkbox" class="switch" data-change="grades"></label>
  <label><span data-i18n="o_c_feedback"></span><input type="checkbox" class="switch" data-change="feedback"></label>
  <label><span data-i18n="o_c_deadlines"></span><input type="checkbox" class="switch" data-change="deadlines"></label>
  <label><span data-i18n="o_c_forum"></span><input type="checkbox" class="switch" data-change="forum"></label>
  <label><span data-i18n="o_c_announcements"></span><input type="checkbox" class="switch" data-change="announcements"></label>
</div>

<h2 data-i18n="o_modules"></h2>
<div class="group" id="modules"><label><small data-i18n="o_modules_empty"></small></label></div>
<script type="module" src="options.js"></script>
</body></html>
