<!doctype html>
<html><head><meta charset="utf-8"><title>LM Companion settings</title>
<link rel="stylesheet" href="../lib/view.css">
<style>
 body{max-width:560px;margin:32px auto;font:14px/1.5 -apple-system,system-ui,"PingFang SC",sans-serif;background:var(--bg);color:var(--fg);padding:0 16px}
 h1{font-size:20px} h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:28px}
 label{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
 small{color:var(--muted);display:block} select,input[type=number]{font:inherit}
 #saved{color:var(--accent);margin-left:8px;opacity:0;transition:opacity .3s}
</style></head>
<body>
<h1>LM Companion <span id="saved">Saved</span></h1>
<p><small>Reads Learning Mall with your own login, in this browser only. Nothing is sent anywhere else. It never submits, posts or opens quizzes.</small></p>

<h2>Where it shows</h2>
<label><span>Toolbar popup<small>Always on.</small></span><input type="checkbox" checked disabled></label>
<label><span>Panel on the Learning Mall dashboard<small>Adds a "Due &amp; missing" block to your Dashboard page only.</small></span><input type="checkbox" id="showPanel"></label>

<h2>Due list</h2>
<label><span>Look ahead</span><select id="windowDays"><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></label>
<label><span>Refresh every</span><select id="refreshMinutes"><option value="30">30 min</option><option value="60">1 hour</option><option value="180">3 hours</option></select></label>

<h2>What changed: show</h2>
<label><span>New materials</span><input type="checkbox" data-change="materials"></label>
<label><span>Grades</span><input type="checkbox" data-change="grades"></label>
<label><span>Feedback</span><input type="checkbox" data-change="feedback"></label>
<label><span>Deadline reminders</span><input type="checkbox" data-change="deadlines"></label>
<label><span>Forum posts</span><input type="checkbox" data-change="forum"></label>
<label><span>Announcements</span><input type="checkbox" data-change="announcements"></label>

<h2>Modules</h2>
<div id="modules"><small>Modules appear after the first sync.</small></div>
<script type="module" src="options.js"></script>
</body></html>
